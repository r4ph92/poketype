services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: poketype
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/create-test-database.sh:/docker-entrypoint-initdb.d/create-test-database.sh:ro
  # Local and CI stand-in for Pusher Channels: a real Pusher-protocol server. Client events stay disabled so only the server publishes.
  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    environment:
      SOKETI_DEFAULT_APP_ID: ${PUSHER_APP_ID}
      SOKETI_DEFAULT_APP_KEY: ${PUSHER_KEY}
      SOKETI_DEFAULT_APP_SECRET: ${PUSHER_SECRET}
      SOKETI_DEFAULT_APP_ENABLE_CLIENT_MESSAGES: "false"
    ports:
      - "6001:6001"

volumes:
  postgres-data:
